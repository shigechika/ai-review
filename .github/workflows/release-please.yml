name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Run release-please in JST so the CHANGELOG entry date matches the
    # JST merge day rather than the runner's UTC clock. release-please
    # formats the version-header date via `new Date().toLocaleDateString('en-CA')`
    # (changelog-notes/github.ts), which respects the TZ environment variable.
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          # A fine-grained PAT lets the tag and Release created by
          # release-please trigger downstream workflows. Tokens attributed
          # to GITHUB_TOKEN cannot fire other workflow runs (GitHub's
          # recursion-prevention rule). This repo currently has no
          # on-release workflow — the one thing that must follow a release,
          # moving the major tag, runs inside this job below precisely so
          # it works without the PAT — but the fallback keeps parity with
          # the other repositories and future-proofs a downstream pipeline.
          # The secret's repo scope needs Contents + Pull requests +
          # Metadata at minimum. Falls back to GITHUB_TOKEN when unset.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Callers pin the MOVING major tag (uses: ...@v1), so every release
      # must drag it along — a release that only mints vX.Y.Z ships to
      # nobody. Done here in the same job rather than in a separate
      # `on: release` workflow because releases created with GITHUB_TOKEN
      # cannot trigger other workflows (GitHub's recursion-prevention
      # rule), which would leave the major tag stuck on the old release.
      - uses: actions/checkout@v7
        if: ${{ steps.rp.outputs.release_created }}
        with:
          fetch-depth: 0
      - name: Move the major tag to the new release
        if: ${{ steps.rp.outputs.release_created }}
        env:
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          case "$TAG" in
            v[0-9]*.*) ;;
            *) echo "::warning::unexpected tag '$TAG' — not moving a major tag"; exit 0 ;;
          esac
          major=${TAG%%.*}
          git tag -f "$major" "$TAG"
          git push -f origin "$major"
