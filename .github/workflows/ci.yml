name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    # No default timeout is 6h — a hung download (the install script curls
    # GitHub directly, no retry/backoff) or a pathological shellcheck input
    # would otherwise block every PR's status check for hours with no
    # self-recovery. Seen in practice: this job sat "in_progress" on the
    # "Run actionlint" step for 2+ hours before being manually cancelled.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run the engine's extraction + logic test suite
        run: bash tests/run_all.sh
