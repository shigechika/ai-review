name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    # No default timeout is 6h — a hung download (the install script curls
    # GitHub directly, no retry/backoff) or a pathological shellcheck input
    # would otherwise block every PR's status check for hours with no
    # self-recovery. Seen in practice: this job sat "in_progress" on the
    # "Run actionlint" step for 2+ hours before being manually cancelled.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        # Direct release download, not the upstream install script — that
        # script's own `curl -L` has no --max-time/--retry, so a stalled
        # connection to GitHub's release CDN hangs forever with nothing to
        # recover it except the job timeout above (observed in practice).
        # Pinned version + explicit timeout/retry here instead.
        run: |
          curl -fsSL --max-time 60 --retry 3 --retry-all-errors \
            -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar xzf actionlint.tar.gz actionlint
      - name: Run actionlint (workflow structure; embedded shell checked separately below)
        # -shellcheck= disables actionlint's built-in shellcheck integration.
        # It has a known, unfixed upstream deadlock (rhysd/actionlint#712):
        # a run: block whose script exceeds the OS pipe buffer (65536 bytes)
        # hangs the process forever. This repo's largest step sits close
        # enough to that threshold to cross it as the engine grows — hit in
        # practice as a silent multi-hour CI hang before being diagnosed.
        run: ./actionlint -color -shellcheck=
      - name: Shellcheck embedded run steps (file-based, avoids the pipe deadlock above)
        # pyyaml pinned + retried for the same reason the actionlint
        # download above is: an unbounded, unretried network call has
        # already caused one silent multi-hour CI hang this same day.
        run: |
          pip install --quiet --retries 3 --timeout 60 "pyyaml==6.0.3"
          python3 scripts/lint-embedded-shell.py

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run the engine's extraction + logic test suite
        run: bash tests/run_all.sh
