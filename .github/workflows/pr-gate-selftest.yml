name: PR Gate selftest

# Dogfoods pr-gate.yml on this repository's own PRs.
#
# Unlike selftest.yml (which reviews a PR with that PR's OWN proposed
# revision of ai-review.yml, because pull_request resolves a relative
# uses: inside the merge ref), pull_request_target ALWAYS runs the
# workflow file as it exists on the base branch — this is precisely what
# makes pull_request_target safe to use with a write-capable token, since
# a PR cannot rewrite the workflow that is about to act on it. The
# practical consequence: a PR that changes pr-gate.yml is evaluated by the
# base branch's pr-gate.yml, not its own proposed change. Real coverage of
# a pr-gate.yml change only starts on the FIRST PR opened after it merges.
#
# This file doubles as the caller template documented in the README, with
# one difference: real callers pin a tag instead of the relative path —
#   uses: shigechika/ai-review/.github/workflows/pr-gate.yml@v1

on:
  pull_request_target:
    types: [opened, reopened, closed]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/pr-gate.yml
