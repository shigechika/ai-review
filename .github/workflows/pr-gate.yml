name: PR Gate

# Reusable admission control for pull requests. Meant to run ALONGSIDE
# ai-review.yml (see README "Quick start"), never merged into it — the two
# files have deliberately different threat models and stay apart on
# purpose:
#
#   * ai-review.yml is advisory-only and never wired to pull_request_target
#     (see its own header comment) — every failure path soft-fails, and it
#     never mutates PR state beyond one sticky comment.
#   * pr-gate.yml is the opposite by design: it DOES use
#     pull_request_target, and it DOES take a blocking action (closing the
#     pull request) when the author is not trusted. A base-repo-scoped
#     token is unavoidable here — closing/labeling a PR is a write, and a
#     plain pull_request event from a fork always gets a read-only
#     GITHUB_TOKEN regardless of the permissions: block, by GitHub design.
#     The usual pull_request_target caution therefore applies: this file
#     must never check out PR content or run anything the PR authored.
#
# Trust rests on live GitHub signals, never a maintained allowlist file
# that could go stale: author_association on the pull request
# (OWNER/MEMBER/COLLABORATOR); a small hardcoded allowlist for this
# repository's own automation accounts (dependabot[bot],
# github-actions[bot]) so routine dependency/release PRs are never
# auto-closed; and, on PRIVATE repositories only, whether the PR's head
# branch lives in this same repository rather than a fork. That last one
# exists because author_association alone has a real blind spot: it can
# report CONTRIBUTOR for a genuine org member/admin whose organization
# membership visibility is set to private (confirmed in production on a
# downstream caller, shigechika/ai-review#37) — GitHub's
# author_association computation does not reliably recognize private
# memberships the way it recognizes public ones. A same-repo (non-fork)
# head branch is evidence that SOMEONE had push access to create that
# branch, which sidesteps the association blind spot — but it does NOT
# by itself prove the person who opened THIS pull request has push
# access: on a public repository, opening a PR between two branches that
# already exist in the base repo only needs read access, which anyone
# has. The signal is only trustworthy where read access is already a
# real grant, i.e. a private repository (every reader was deliberately
# invited) — so it is gated on `pr.base.repo.visibility === "private"`
# (not the legacy `private` boolean, whose value for a GitHub Enterprise
# "internal" repo — readable enterprise-wide, not just by invitees — is
# not clearly documented) and never applied on a public or internal
# repo. A CONTRIBUTOR (has had a PR merged before,
# but holds no standing write access) is still deliberately NOT trusted
# on association alone — only a maintainer reopening the closed PR (or
# the same-repo-on-private-repo exception above) admits one.
#
# On success this workflow adds the ai-review label (configurable via
# review-label) and nothing else — it never posts findings and never
# touches the AI_REVIEW_ENDPOINT/AI_REVIEW_API_KEY secrets ai-review.yml
# uses, because it never needs them. Callers are expected to gate their
# ai-review job on that same label if they want the two workflows to
# compose (see the README recipe); this file has no opinion on how the
# label is consumed downstream. Same-repo release-please branches never
# get the label at all, even though they are trusted — ai-review.yml's
# own job condition already skips them unconditionally, so labeling one
# would just be a misleading promise of a review that will never happen.

on:
  workflow_call:
    inputs:
      review-label:
        description: "Label added to admitted pull requests (default: ai-review)"
        type: string
        required: false
        default: "ai-review"

jobs:
  gate:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' &&
      vars.AI_REVIEW_DISABLE_GATE != 'true'
    steps:
      - name: Admit or close based on author trust
        uses: actions/github-script@v9
        env:
          REVIEW_LABEL: ${{ inputs.review-label }}
        with:
          script: |
            // REVIEW_LABEL travels through env, not string-interpolated
            // into the script body — this is untrusted-adjacent code (a
            // pull_request_target run), so no PR-influenced or
            // caller-influenced value is ever spliced into the JS source
            // itself.
            const REVIEW_LABEL = process.env.REVIEW_LABEL;
            const GATE_MARKER = "<!-- ai-review-pr-gate -->";

            // First-party automation for this repository — never
            // auto-closed, regardless of what ai-review.yml itself does
            // or does not skip (it only excludes dependabot[bot] via its
            // own job condition, not github-actions[bot] — do not assume
            // parity between the two lists). release-please and similar
            // repo-owned automation open PRs as github-actions[bot]; those
            // must stay open too.
            const TRUSTED_BOTS = new Set(["dependabot[bot]", "github-actions[bot]"]);

            // GitHub-computed, cannot be spoofed by the PR author and
            // never goes stale the way a hand-maintained file would.
            // CONTRIBUTOR (merged before, no standing write access) is
            // deliberately excluded — only a maintainer's reopen admits
            // one of these.
            const TRUSTED_ASSOCIATIONS = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);

            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const association = pr.author_association;
            const pullNumber = pr.number;

            // No precheck of current labels here: addLabels is idempotent
            // (re-adding a label already present is a harmless no-op, not
            // an error), and removeLabel below already tolerates a 404
            // (label already absent) the same way. A precheck-then-act
            // would only add a paginated fetch and a race window between
            // the read and the write, for no correctness benefit.
            async function addReviewLabel() {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                labels: [REVIEW_LABEL],
              });
            }

            async function removeReviewLabel() {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullNumber,
                  name: REVIEW_LABEL,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            // Edits the existing comment in place — the opposite of
            // ai-review.yml's own repost-then-delete sticky comment
            // (deliberately changed to repost, since GitHub never
            // notifies watchers on an edit). That's safe here only
            // because the rejection message below is static, so this
            // rarely does more than the identical-body short-circuit;
            // if this message is ever made to vary per run, revisit
            // whether a silent edit is still the right call.
            async function upsertGateComment(message) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                per_page: 100,
              });
              const body = `${GATE_MARKER}\n${message}`;
              // Matched by THIS workflow's own posting identity
              // (github-actions[bot], via the default GITHUB_TOKEN), not
              // any bot — a generic "type === Bot" match could pick up
              // and silently overwrite a comment from a different bot/app
              // that happens to contain the marker text.
              const existing = comments.find(
                (comment) => comment.user?.login === "github-actions[bot]" && comment.body?.includes(GATE_MARKER)
              );
              if (existing?.body === body) return;
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                body,
              });
            }

            // closed: keep label state honest, nothing else to decide.
            // (Note: this branch never fires for a close performed by
            // THIS workflow's own GITHUB_TOKEN — GitHub does not re-fire
            // events caused by the default token, to prevent recursive
            // runs. Harmless here since the rejection path below already
            // removes the label itself before closing.)
            if (context.payload.action === "closed") {
              await removeReviewLabel();
              return;
            }

            if (TRUSTED_BOTS.has(author)) {
              core.info(`Leaving bot-authored PR open, ungated: ${author}`);
              return;
            }

            const headRef = pr.head?.ref ?? "";
            const isSameRepoPR = pr.head?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;

            // Same-repo release-please branches are never actually
            // reviewed — ai-review.yml's own job condition skips them
            // unconditionally, regardless of author or label. Labeling
            // one here would be misleading (the label implies a review
            // is coming; for this PR shape, one never will) even though
            // the PR is legitimately trusted (release-please usually
            // opens as the repo owner or a first-party token, so it
            // would otherwise sail through the checks below). Mirrors
            // ai-review.yml's own release-please--* / same-repo
            // condition exactly. Checked ahead of the general
            // same-repo trust rule just below so this specific shape
            // still gets no label.
            const isReleasePleaseBranch = isSameRepoPR && headRef.startsWith("release-please--");
            if (isReleasePleaseBranch) {
              core.info(`Leaving release-please PR open, ungated: ${headRef}`);
              return;
            }

            // A pull request whose head branch lives in THIS repository
            // (not a fork) proves SOMEONE had push access to create that
            // branch — but not necessarily the person who opened THIS
            // pull request: on a PUBLIC repository, opening a PR between
            // two branches that already exist in the base repo only
            // needs read access, which anyone has. So this signal is
            // trustworthy only where read access itself is already a
            // real grant — a PRIVATE repository, where every reader was
            // deliberately invited. Restricted to
            // `pr.base.repo.visibility === "private"` for exactly that
            // reason; do not drop this guard to "simplify" the check, it
            // is the difference between closing a real gap and opening
            // the gate to the public internet. Uses `visibility`
            // (`"public"`/`"private"`/`"internal"`), not the legacy
            // `private` boolean: on GitHub Enterprise, an "internal"
            // repository is readable by every enterprise member, not
            // just deliberately-invited collaborators, and GitHub's own
            // docs do not clearly state whether the legacy `private`
            // field is `true` or `false` for that visibility — so the
            // boolean cannot be trusted to encode the "every reader was
            // invited" assumption this check depends on, while the
            // three-way `visibility` string can. Confirmed present on a
            // real PR payload before relying on it (both fields already
            // appear together on `base.repo` for the pull_request
            // resource).
            //
            // Added after author_association was caught misreporting
            // CONTRIBUTOR for a genuine write-access org admin on a
            // private downstream caller repo (root-caused and tracked
            // in shigechika/ai-review#37): the org membership was
            // active/admin, but its visibility was private, and GitHub's
            // author_association computation does not reliably recognize
            // a private membership the way it recognizes a public one.
            // Checked ahead of TRUSTED_ASSOCIATIONS so it also closes
            // that gap without depending on the member ever making their
            // membership public.
            //
            // Also checked ahead of the reopened-override branch below,
            // which means a same-repo PR on a private repo is the one
            // case where the author's own reopen IS honored (unlike the
            // general rule the comment below documents) — accepted
            // because private-repo read access is itself already a
            // meaningful grant, unlike author_association alone.
            const isTrustedSameRepoPR = isSameRepoPR && pr.base?.repo?.visibility === "private";
            if (isTrustedSameRepoPR) {
              core.info(`${author} opened a same-repo PR (head branch "${headRef}") on a private repository — trusted without relying on author_association`);
              await addReviewLabel();
              return;
            }

            // A closed PR can only be reopened by its author or someone
            // GitHub itself has authorized to do so (write, Triage, any
            // custom role derived from either, or whatever access model
            // GitHub adds next) — that check already happened, by GitHub,
            // before this event could fire at all. So rather than
            // re-deriving the same authorization decision from
            // permission/role_name heuristics (three rounds of this
            // repo's own selftest each found a different custom-role
            // shape those fields miss — see CLAUDE.md), trust the fact
            // that reopening SUCCEEDED: if whoever did it is not the
            // PR's own author, GitHub already vetted them. Falls through
            // to the normal check when the author reopened their own
            // rejected PR (GitHub always allows that, trusted or not),
            // so enforcement stays consistent instead of being undone by
            // the same untrusted actor re-clicking reopen. (A same-repo
            // PR on a private repo never reaches this block at all — it
            // already returned above via isTrustedSameRepoPR, which is
            // the one case where the author's own reopen IS honored; see
            // that check's comment for why that is an accepted
            // exception rather than a hole in this one.)
            if (context.payload.action === "reopened") {
              const senderLogin = context.payload.sender?.login;
              if (senderLogin && senderLogin !== author) {
                core.info(`${senderLogin} reopened PR #${pullNumber} (not the PR author) — honoring the override`);
                await addReviewLabel();
                return;
              }
            }

            if (TRUSTED_ASSOCIATIONS.has(association)) {
              core.info(`${author} is trusted (author_association=${association})`);
              await addReviewLabel();
              return;
            }

            core.info(`${author} is not a trusted author (author_association=${association}) — closing PR #${pullNumber}`);
            await removeReviewLabel();
            await upsertGateComment(
              [
                `Hi @${author}, thanks for your interest in contributing.`,
                "",
                "This repository only runs automated review on pull requests from maintainers, " +
                  "collaborators, or members — a requirement this pull request does not currently meet.",
                "",
                "If a maintainer wants to accept this contribution, reopening the pull request will " +
                  "leave it open and admit it for review.",
              ].join("\n")
            );
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              state: "closed",
            });
